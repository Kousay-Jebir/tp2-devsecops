name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the "test" stage: pytest runs inside the build, a failing test fails the job
      - name: Run unit tests in container
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Builds the production image once; later jobs (DAST) reuse it
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: notes-app:ci
          outputs: type=docker,dest=/tmp/notes-app.tar
          cache-from: type=gha

      - name: Upload image for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-image
          path: /tmp/notes-app.tar
          retention-days: 1